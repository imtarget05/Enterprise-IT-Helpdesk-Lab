# =============================================================================
# SonarQube Cloud — Automatic Analysis đọc file NÀY (không đọc sonar-project.properties).
# Docs: https://docs.sonarsource.com/sonarcloud/analyzing-source-code/automatic-analysis
#
# Mục đích: thu hẹp scope quét về code thật để giảm LOC tính vào quota của
# organization (org đang vượt subscription limit). Chỉ dùng đường dẫn literal,
# cách nhau bằng dấu phẩy — KHÔNG dùng wildcard (**).
# File sonar-project.properties trong repo chỉ dùng cho CI-based scan (có SONAR_TOKEN).
# =============================================================================
sonar.sources=internal-portal/src,internal-portal/server.js,internal-portal/public/app.js,scripts
sonar.tests=internal-portal/test
sonar.sourceEncoding=UTF-8

# Loại scope quét: docs/tickets/scenario/fixtures không phải code sản phẩm.
# Ghi literal từng thư mục/file, không dùng wildcard.
sonar.exclusions=docs,scenarios,tickets,artifacts,internal-portal/data,internal-portal/fixtures,internal-portal/public/openapi.yaml,internal-portal/package-lock.json
sonar.test.exclusions=internal-portal/test

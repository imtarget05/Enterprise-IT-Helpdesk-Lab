# =============================================================================
#  CI — Enterprise IT Helpdesk Lab
#
#  5 job độc lập, chạy song song trên mỗi push/PR vào main:
#    1. portal-tests : npm test (node:test) + test-api.sh (curl smoke)
#                      trên ma trận Node 18 / 20 / 22
#    2. ps1-syntax   : parse file PowerShell bằng AST parser THẬT (pwsh có sẵn
#                      trên ubuntu-latest) qua scripts/verify-ps1-syntax.sh
#    3. compose-config: validate docker-compose.yml + so khớp biến với .env.example
#    4. openapi-spec  : swagger-cli validate tài liệu OpenAPI 3.1 của REST API
#    5. sonarcloud    : quét SonarQube Cloud (CI-based). Bỏ qua êm nếu chưa có
#                      secret SONAR_TOKEN — khi đó Sonar dùng Automatic Analysis
#                      với cấu hình trong sonar-project.properties.
#
#  Coverage: job portal-tests (Node 22) chạy `npm run test:coverage` (c8) để
#  sinh internal-portal/coverage/lcov.info cho Sonar (sonar.javascript.lcov).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Node test suite + REST API smoke test (curl)
  # ---------------------------------------------------------------------------
  portal-tests:
    name: Portal tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal-portal
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: internal-portal/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Unit + integration tests (node:test)
        run: npm test

      - name: Coverage for Sonar (Node 22 only, c8 → lcov.info)
        if: matrix.node == '22'
        run: npm run test:coverage -- --reporter=none || npx --yes c8 --reporter=lcov --reporter=text npm test

      - name: Upload coverage artifact (Node 22 only)
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: internal-portal/coverage/lcov.info
          if-no-files-found: warn

      - name: REST API smoke test (curl, baseline endpoints; factory routes in node:test)
        run: ./test-api.sh

  # ---------------------------------------------------------------------------
  # 2) PowerShell AST syntax check (không cần Windows)
  # ---------------------------------------------------------------------------
  ps1-syntax:
    name: PowerShell AST syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse .ps1 bằng PowerShell AST parser
        run: bash scripts/verify-ps1-syntax.sh

  # -----------------------------------------------------------------------
  # 3) Validate Docker Compose config + biến môi trường
  # ---------------------------------------------------------------------------
  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: docker compose config --quiet
        run: docker compose -f internal-portal/docker-compose.yml config --quiet

      - name: Kiểm tra biến interpolation có trong .env.example
        run: bash scripts/verify-config.sh

  # ---------------------------------------------------------------------------
  # 4) Validate OpenAPI spec (swagger-cli) — tài liệu API luôn đúng chuẩn
  # ---------------------------------------------------------------------------
  openapi-spec:
    name: OpenAPI spec valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate internal-portal/public/openapi.yaml
        run: npx --yes swagger-cli validate internal-portal/public/openapi.yaml

  # ---------------------------------------------------------------------------
  # 5) SonarQube Cloud scan (CI-based) — fix "last analysis has failed" của
  #    Automatic Analysis bằng cách quét chủ động từ CI.
  #    - Cần secret SONAR_TOKEN (SonarCloud → My Account → Security → Token).
  #    - Chưa có token → job skip êm, không làm đỏ CI.
  #    - Có token → download coverage từ job portal-tests rồi quét.
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    needs: [portal-tests]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout (full history cho blame/new-code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: internal-portal/coverage
        continue-on-error: true

      - name: Check SONAR_TOKEN
        id: check-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ SONAR_TOKEN chưa có — bỏ qua scan, Sonar dùng Automatic Analysis."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # NOTE: từng dùng SonarSource/sonarqube-scan-action@v5 nhưng step
      # "Run SonarScanner" của nó exit 1 tức thì mà không in log (2 run liên tiếp).
      # Gọi sonar-scanner CLI trực tiếp để log minh bạch, dễ debug.
      - name: SonarQube Cloud scan (sonar-scanner CLI trực tiếp)
        if: steps.check-token.outputs.available == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          SCANNER_VERSION="7.2.0.5079"
          SCANNER_DIR="$RUNNER_TEMP/sonar-scanner-cli"
          if [ ! -x "$SCANNER_DIR/bin/sonar-scanner" ]; then
            echo "⬇ Tải SonarScanner CLI $SCANNER_VERSION ..."
            mkdir -p "$SCANNER_DIR" /tmp/sonar-dl
            curl -sL -o /tmp/sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
            unzip -q -o /tmp/sonar-scanner.zip -d /tmp/sonar-dl
            mv -f /tmp/sonar-dl/sonar-scanner-${SCANNER_VERSION}-linux-x64/* "$SCANNER_DIR/"
          fi
          EXTRA_ARGS=""
          if [ -n "${SONAR_PROJECT_KEY:-}" ]; then
            echo "→ Override projectKey từ secret SONAR_PROJECT_KEY."
            EXTRA_ARGS="-Dsonar.projectKey=${SONAR_PROJECT_KEY}"
          else
            echo "→ Dùng projectKey trong sonar-project.properties."
          fi
          # shellcheck disable=SC2086
          "$SCANNER_DIR/bin/sonar-scanner" -Dsonar.token="$SONAR_TOKEN" $EXTRA_ARGS

name: Terraform Validate

# =============================================================================
#  Phase 1 gate: Terraform is the canonical, deployable IaC language.
#
#  What runs WITHOUT Azure credentials (every push/PR):
#    1. terraform fmt -check          — canonical formatting
#    2. terraform init -backend=false — provider pins resolve
#    3. terraform validate            — static configuration validity
#    4. terraform test                — 13 mocked runs (parity + wiring + input
#                                       validation + negative controls)
#    5. unittest discover             — 29 tests proving each gate control BITES
#                                       (frozen / parity / plan-invariants)
#    6. check_bicep_frozen.py         — Bicep templates unchanged since Phase 1
#    7. check_parity.py               — 130 Bicep ↔ Terraform checks hold
#    8. check_plan_invariants.py      — 13 invariants hold on the committed
#                                       control-proof fixture
#
#  What runs ONLY when the repo variable AZURE_OIDC_ENABLED == 'true'
#  (Phase 2+ wiring; the job is skipped otherwise, never silently green):
#    9. a REAL `terraform plan` with GitHub OIDC against the evidence resource
#       group, then check_plan_invariants.py against the REAL plan JSON.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-validate.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-validate.yml'

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  # ---------------------------------------------------------------------------
  # 1-8) Credential-free gate (validate + test + controls with teeth)
  # ---------------------------------------------------------------------------
  validate:
    name: fmt · validate · test · controls
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WHY 1.16.3 AND NOT "1.9.*": this pin previously said 1.9.* with no
      # recorded reason, while the suite it gates had only ever been MEASURED on
      # 1.16.3. That is the same anti-pattern as a scanner that goes green or red
      # on a transient input: CI reported a failure nobody could reproduce,
      # because the runner and the author were on different Terraform versions.
      #
      # The concrete 1.9 failure: terraform test tears down its state at the end
      # of every run, and the key vault declares
      # "lifecycle { prevent_destroy = true }". On 1.9 that teardown destroy is
      # rejected by prevent_destroy, so the run ends with "Terraform left the
      # following resources in state ... they need to be cleaned up manually" and
      # exits 1 — on a run whose assertions all passed. A gate that fails on its
      # own cleanup, for a reason unrelated to the code under test, is a gate
      # people learn to re-run until it passes.
      #
      # Pinned exactly, not as a range: a floating version lets a release change
      # this verdict on an unrelated PR.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Formatting (fmt -check, no drift)
        run: terraform fmt -check -recursive

      - name: Init providers (backend=false, read-only)
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Unit tests (mocked provider, no Azure calls)
        run: terraform test

      - name: Control bite tests (plan-invariant controls)
        run: python3 -m unittest discover -s scripts/tests -v

      # The Bicep freeze control and the Bicep↔Terraform parity control were
      # removed together with the Bicep stack they existed to police. Neither has
      # a re-anchored replacement, and that is a REAL loss, not a tidy-up:
      # `check_parity.py` was the only independent oracle proving the Terraform
      # port matched the Bicep it replaced, and with the Bicep gone there is
      # nothing left for it to compare against. The manifest that stated
      # "Bicep under infra/ is FROZEN and is the parity source of truth" no
      # longer describes this repository.
      #
      # What still guards the Terraform: `terraform validate`, the 13
      # `terraform test` contract assertions, and the 13 plan-invariant checks
      # with their 18 bite tests, all of which assert against Terraform and
      # plan JSON directly.
      - name: Plan-invariant control on the committed fixture
        run: python3 scripts/check_plan_invariants.py fixtures/plan-ok.json

  # ---------------------------------------------------------------------------
  # 9) REAL plan against Azure — Phase 2+ only, gated on repo variable.
  #    Never secrets.* in `if` (unavailable there); vars.AZURE_OIDC_ENABLED is
  #    an explicit, reviewable switch set when Phase 2 lands OIDC.
  # ---------------------------------------------------------------------------
  real-plan:
    name: real plan · plan-JSON control
    runs-on: ubuntu-latest
    if: vars.AZURE_OIDC_ENABLED == 'true'
    needs: [validate]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Same pin and same reasoning as the offline gate above.
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Init providers (backend=false, read-only)
        run: terraform init -backend=false -input=false

      - name: Azure login (GitHub OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Plan is read-only: it creates nothing. The plan JSON is transient —
      # it is checked and then discarded, never committed (it may embed the
      # configured admin password the same way `terraform plan` always does).
      - name: Real plan (read-only, dev tfvars, refresh on)
        run: |
          export ARM_USE_OIDC=true
          export ARM_SUBSCRIPTION_ID='${{ vars.AZURE_SUBSCRIPTION_ID }}'
          terraform plan -var-file=env/dev.tfvars -out="$RUNNER_TEMP/phase1-dev.tfplan"

      - name: Plan-JSON invariant control on the REAL plan
        run: |
          terraform show -json "$RUNNER_TEMP/phase1-dev.tfplan" > "$RUNNER_TEMP/plan.json"
          python3 scripts/check_plan_invariants.py "$RUNNER_TEMP/plan.json"

      - name: Discard the transient plan
        if: always()
        run: rm -f "$RUNNER_TEMP/phase1-dev.tfplan" "$RUNNER_TEMP/plan.json"

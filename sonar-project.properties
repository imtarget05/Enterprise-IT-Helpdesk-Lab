# =============================================================================
# SonarQube Cloud — Enterprise IT Helpdesk Lab
# Docs: https://docs.sonarsource.com/sonarcloud/advanced-setup/ci-based-analysis/
#
# 2 chế độ đều chạy được:
#  - Automatic Analysis (mặc định): Sonar tự quét main khi push, dùng file này
#    để loại trừ nhiễu (test, fixtures, images, coverage).
#  - CI-based Analysis (khuyên dùng khi Automatic báo "last analysis failed"):
#    thêm secret SONAR_TOKEN vào GitHub → job `sonarcloud` trong ci.yml sẽ quét.
#    Nếu repo thuộc org khác, sửa 2 dòng sonar.organization / sonar.projectKey
#    cho khớp với https://sonarcloud.io (Project → Information).
# =============================================================================

# --- BẮT BUỘC sửa cho khớp SonarCloud (mặc định theo GitHub imtarget05) ---
sonar.organization=imtarget05
sonar.projectKey=imtarget05_Enterprise-IT-Helpdesk-Lab
sonar.projectName=Enterprise IT Helpdesk Lab
sonar.projectVersion=2.0.0

# --- Nguồn quét ---
sonar.sources=internal-portal/src,internal-portal/server.js,internal-portal/public/app.js,scripts
sonar.tests=internal-portal/test
sonar.sourceEncoding=UTF-8

# --- Ngôn ngữ ---
sonar.javascript.file.suffixes=.js
sonar.python.version=3.11

# --- Coverage (do `npm run test:coverage` sinh ra bằng c8) ---
sonar.javascript.lcov.reportPaths=internal-portal/coverage/lcov.info
sonar.python.coverage.reportPaths=internal-portal/coverage/coverage.xml
sonar.coverage.exclusions=internal-portal/test/**,internal-portal/fixtures/**,internal-portal/public/**,scripts/**,**/*.test.js

# --- Loại trừ khỏi mọi phân tích (giảm false positive + tránh fail analysis) ---
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/.git/**,\
  internal-portal/data/**,\
  internal-portal/fixtures/**,\
  internal-portal/python-portal/rag/__pycache__/**,\
  docs/images/**,\
  artifacts/**,\
  **/*.png,**/*.jpg,**/*.ico,\
  **/package-lock.json

# --- Test files: vẫn quét nhưng không tính duplication/coverage ---
sonar.test.exclusions=internal-portal/test/**,**/*.test.js
sonar.cpd.exclusions=internal-portal/test/**,internal-portal/fixtures/**,internal-portal/public/app.js

# --- New Code: reference branch main (hiển thị Quality Gate "deployable?") ---
sonar.newCode.referenceBranch=main

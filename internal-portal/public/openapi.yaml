                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      hours: { type: integer }
                  monitoring: { type: object }
                  tickets: { type: object }
                  ai: { type: object }
                  summary: { type: array, items: { type: string } }
            text/markdown:
              schema: { type: string }

  /api/integrations/minierp/incidents:
    post:
      tags: [Integrations]
      summary: Nhận incident MiniERP idempotent theo externalRef
      operationId: receiveMiniErpIncident
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniERPIncidentInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniERPIncident'
          description: Payload trùng, trả lại ticket cũ kèm idempotent=true
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniERPIncident'
          description: Ticket mới
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Sai integration key }
        '409': { description: externalRef đã dùng với payload khác }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/audit:
    get:
      tags: [Audit]
      summary: Đọc audit trail gần đây
      operationId: listAuditEvents
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Danh sách audit event đã lưu bền vững
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: Khoá chính (integer id trong `data/db.json`)
      schema:
        type: integer
        example: 1
    QuerySearch:
      name: q
      in: query
      description: Tìm chuỗi con (không phân biệt hoa/thường) trên các trường văn bản của resource
      schema:
        type: string
        example: thinkpad
    FilterStatusAsset:
      name: status
      in: query
      description: Lọc theo trạng thái tài sản
      schema:
        $ref: '#/components/schemas/AssetStatus'
    FilterType:
      name: type
      in: query
      description: Lọc theo loại thiết bị
      schema:
        type: string
        example: Laptop
    FilterStatusTicket:
      name: status
      in: query
      description: Lọc theo trạng thái ticket
      schema:
        $ref: '#/components/schemas/TicketStatus'
    FilterPriority:
      name: priority
      in: query
      description: Lọc theo mức độ ưu tiên
      schema:
        $ref: '#/components/schemas/Priority'

  responses:
    Unauthorized:
      description: Thiếu hoặc không hợp lệ Bearer session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication required.
            status: 401
            path: /api/tickets
    Forbidden:
      description: Người dùng đã đăng nhập nhưng không có permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Insufficient portal role.
            status: 403
            path: /api/changes
    BadRequest:
      description: Thiếu trường bắt buộc hoặc payload không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Dữ liệu đăng ký tài sản không hợp lệ.
            status: 400
            path: /api/assets
            details:
              - 'Thiếu trường bắt buộc: brand'
    NotFound:
      description: Không tìm thấy bản ghi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Tài sản với id "999" không tồn tại.'
            status: 404
            path: /api/assets/999
    Conflict:
      description: Trùng Asset Tag hoặc Serial (ràng buộc duy nhất của kiểm kê)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Mã tài sản (Asset Tag) "LP-IT-001" đã tồn tại — trùng với LP-IT-001 (id 1).'
            status: 409
            path: /api/assets
    Unprocessable:
      description: Giá trị enum không hợp lệ (status/priority)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Trạng thái không hợp lệ: "Broken". Giá trị cho phép: Active, In Storage, Maintenance, Retired.'
            status: 422
            path: /api/assets
    MethodNotAllowed:
      description: Sai HTTP method cho endpoint đã tồn tại (kèm header `Allow`)
      headers:
        Allow:
          description: Danh sách method được phép
          schema:
            type: string
            example: GET, POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Phương thức PUT không được hỗ trợ cho /api/assets.
            allow: [GET, POST]
            status: 405
            path: /api/assets


  schemas:
    Problem:
      type: object
      description: Problem record theo ITIL
      required: [id, title, status, linkedTicketIds, createdAt]
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: ERP intermittent }
        service: { type: string, example: MiniERP }
        status: { type: string, example: OPEN }
        rootCause: { type: string }
        workaround: { type: string }
        knownError: { type: boolean }
        linkedTicketIds: { type: array, items: { type: integer } }
        owner: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Change:
      type: object
      description: Change record có kiểm soát và rollback
      required: [id, title, reason, risk, implementationState]
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: Firewall rule update }
        reason: { type: string }
        risk: { type: string, enum: [LOW, MEDIUM, HIGH] }
        rollbackPlan: { type: string }
        implementationState: { type: string, example: DRAFT }
        approval: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AccessRequest:
      type: object
      description: Onboarding/offboarding access request
      required: [id, requestType, employeeId, name, executionState, evidence]
      properties:
        id: { type: integer, example: 1 }
        requestType: { type: string, enum: [ONBOARDING, OFFBOARDING] }
        employeeId: { type: string, example: EMP-0101 }
        name: { type: string, example: Nguyen Thi Mai }
        upn: { type: string }
        department: { type: string }
        requestedGroups: { type: array, items: { type: string } }
        requestedErpRole: { type: string }
        executionState: { type: string, example: READY }
        evidence: { type: array, items: { type: object } }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      description: Một dòng audit trail
      required: [id, at, actor, action, entityType]
      properties:
        id: { type: integer }
        at: { type: string }
        actor: { type: string }
        role: { type: string }
        action: { type: string, example: TICKET_TRANSITION }
        entityType: { type: string }
        entityId: { type: integer, nullable: true }
        details: { type: object, additionalProperties: true }

    AssetLifecycleStatus:
      type: string
      description: >-
        Trạng thái vòng đời của tài sản. Runtime chấp nhận CẢ tên canonical
        (`IN_STOCK`, `ASSIGNED`, `REPAIR`, `LOST`) lẫn nhãn legacy
        (`Active`, `In Storage`, `Maintenance`, `Retired`); `lifecycleStatus`
        được quy đổi sang nhãn canonical khi input dùng tên legacy.
      enum: [IN_STOCK, ASSIGNED, REPAIR, LOST, Active, 'In Storage', Maintenance, Retired]

    AssetStatus:
      type: string
      description: Trạng thái vòng đời của tài sản
      enum: [Active, In Storage, Maintenance, Retired]

    TicketStatus:
      type: string
      description: Trạng thái ticket theo vòng đời ITIL
      enum: [Open, In Progress, Resolved, Closed]

    Priority:
      type: string
      description: Mức độ ưu tiên (`High`/`Critical` sẽ kích hoạt cảnh báo tự động)
      enum: [Low, Medium, High, Critical]

    Asset:
      type: object
      description: Tài sản CNTT đã đăng ký trong hệ thống
      required: [id, tag, type, brand, model, serial, assignedTo, dept, status, ip, createdAt]
      properties:
        id:
          type: integer
          example: 1
        tag:
          type: string
          description: Mã tài sản — duy nhất trong toàn hệ thống
          example: LP-IT-001
        type:
          type: string
          description: Loại thiết bị (Laptop, Desktop PC, Printer, Network Switch, …)
          example: Laptop
        brand:
          type: string
          example: Lenovo
        model:
          type: string
          example: ThinkPad T14 Gen 4
        serial:
          type: string
          description: Serial — duy nhất nếu được cung cấp
          example: PF-39X8K2
        assignedTo:
          type: string
          description: Người đang sử dụng, hoặc `Unassigned` khi nằm trong kho
          example: Mai Nguyen Binh Tan
        dept:
          type: string
          example: IT Support
        status:
          $ref: '#/components/schemas/AssetLifecycleStatus'
        ip:
          type: string
          description: Địa chỉ IP đang cấp, `-` nếu chưa gán
          example: 192.168.10.101
        createdAt:
          type: string
          description: Định dạng `yyyy-mm-dd hh:mm`
          example: '2026-09-23 08:00'
        updatedAt:
          type: string
          description: Chỉ xuất hiện sau khi tài sản được PATCH ít nhất một lần
          example: '2026-09-23 14:10'

    AssetInput:
      type: object
      description: >-
        Payload đăng ký tài sản mới. Runtime chấp nhận các tên tương đương
        (`assetTag`/`tag`, `manufacturer`/`brand`, `serialNumber`/`serial`) và
        fallback độc lập cho từng cặp. `anyOf` mô tả đủ tám tổ hợp alias hợp lệ
        thay vì `oneOf`, vốn từ chối payload chứa cả hai tên của cùng một cặp.
      properties:
        assetTag: { type: string, description: Mã tài sản (canonical), example: LP-SALES-021 }
        assetType: { type: string, description: Loại thiết bị (canonical), example: LAPTOP }
        manufacturer: { type: string, description: Hãng sản xuất (canonical), example: Dell }
        serialNumber: { type: string, description: Số serial (canonical), example: 9PLK21X }
        employee: { type: string, description: Người được giao (alias của `assignedTo`), example: Le Hoang Nam }
        assignedTo: { type: string, default: Unassigned }
        tag: { type: string, description: Alias legacy của `assetTag`, example: LP-SALES-021 }
        type: { type: string, description: Alias legacy của `assetType`, example: LAPTOP }
        brand: { type: string, description: Alias legacy của `manufacturer`, example: Dell }
        serial: { type: string, description: Alias legacy của `serialNumber`, example: 9PLK21X }
        model: { type: string, example: Latitude 5450 }
        dept: { type: string, default: General }
        businessArea: { type: string }
        location: { type: string }
        hostname: { type: string }
        macAddress: { type: string }
        notes: { type: string }
        ip: { type: string }
        ipAddress: { type: string }
        vlan: { type: string }
        criticality: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL], default: MEDIUM }
        status: { $ref: '#/components/schemas/AssetLifecycleStatus' }
        lifecycleStatus: { $ref: '#/components/schemas/AssetLifecycleStatus' }
      anyOf:
        - required: [assetTag, manufacturer, model, serialNumber]
        - required: [assetTag, manufacturer, model, serial]
        - required: [assetTag, brand, model, serialNumber]
        - required: [assetTag, brand, model, serial]
        - required: [tag, manufacturer, model, serialNumber]
        - required: [tag, manufacturer, model, serial]
        - required: [tag, brand, model, serialNumber]
        - required: [tag, brand, model, serial]
      additionalProperties: true

    AssetPatchInput:
      type: object
      description: >-
        Payload cập nhật một phần — chỉ gửi các trường cần thay đổi. Runtime chấp
        nhận cả tên canonical lẫn alias legacy. Payload rỗng bị từ chối với 400
        trước khi ghi audit hay thay đổi dữ liệu. Payload chỉ chứa trường lạ —
        không trường nào nằm trong `properties` — cũng bị từ chối với 400, nên
        `anyOf` yêu cầu tối thiểu một trường đã biết. `additionalProperties` vẫn
        là `true` vì runtime bỏ qua trường lạ đi kèm một trường đã biết.
      minProperties: 1
      properties:
        assetTag: { type: string, description: Alias canonical của `tag` }
        assetType: { type: string, description: Alias canonical của `type` }
        manufacturer: { type: string, description: Alias canonical của `brand` }
        serialNumber: { type: string, description: Alias canonical của `serial` }
        employee: { type: string, description: Alias của `assignedTo` }
        tag: { type: string, description: Alias legacy của `assetTag` }
        type: { type: string, description: Alias legacy của `assetType` }
        brand: { type: string, description: Alias legacy của `manufacturer` }
        serial: { type: string, description: Alias legacy của `serialNumber` }
        assignedTo: { type: string }
        model: { type: string }
        dept: { type: string }
        businessArea: { type: string }
        location: { type: string }
        hostname: { type: string }
        macAddress: { type: string }
        notes: { type: string }
        criticality: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { $ref: '#/components/schemas/AssetLifecycleStatus' }
        lifecycleStatus: { $ref: '#/components/schemas/AssetLifecycleStatus' }
        ip: { type: string }
        ipAddress: { type: string }
        vlan: { type: string }
      anyOf:
        - required: [assetTag]
        - required: [assetType]
        - required: [manufacturer]
        - required: [serialNumber]
        - required: [employee]
        - required: [tag]
        - required: [type]
        - required: [brand]
        - required: [serial]
        - required: [assignedTo]
        - required: [model]
        - required: [dept]
        - required: [businessArea]
        - required: [location]
        - required: [hostname]
        - required: [macAddress]
        - required: [notes]
        - required: [criticality]
        - required: [status]
        - required: [lifecycleStatus]
        - required: [ip]
        - required: [ipAddress]
        - required: [vlan]
      additionalProperties: true

    Ticket:
      type: object
      description: Ticket hỗ trợ theo vòng đời ITIL
      required: [id, title, requester, dept, priority, status, category, createdAt]
      properties:
        id:
          type: integer
          example: 1001
        title:
          type: string
          example: Cannot access Internet due to APIPA IP
        requester:
          type: string
          example: Nguyen Thi Mai
        dept:
          type: string
          example: Accounting
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/TicketStatus'
        category:
          type: string
          description: Phân loại sự cố (Network, DNS, Active Directory, File Server, …)
          example: Network
        createdAt:
          type: string
          example: '2026-09-23 08:30'
        updatedAt:
          type: string
          example: '2026-09-23 14:10'
        resolvedAt:
          type: string
          description: Chỉ có khi ticket Resolved/Closed
          example: '2026-09-23 11:05'

    TicketInput:
      type: object
      description: Payload tạo ticket mới
      required: [title, requester]
      properties:
        description:
          type: string
          description: Mô tả chi tiết yêu cầu / sự cố
          example: Không phân giải được DNS sau khi đổi Wi-Fi
        title:
          type: string
          example: Cannot resolve DNS after changing Wi-Fi
        requester:
          type: string
          example: Le Hoang Nam
        dept:
          type: string
          default: General
        priority:
          $ref: '#/components/schemas/Priority'
          default: Medium
        category:
          type: string
          default: General

    MiniERPIncident:
      type: object
      description: Ticket sinh ra từ incident MiniERP (idempotent theo externalRef)
      required: [id, title, source, externalRef, status]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        source: { type: string, example: MINIERP }
        externalRef: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        state: { type: string, example: NEW }
        priority: { $ref: '#/components/schemas/Priority' }
        idempotent: { type: boolean, description: true khi payload trùng externalRef }

    TicketStatusUpdateInput:
      type: object
      description: >-
        Payload đổi trạng thái ticket qua endpoint tương thích. `status` KHÔNG
        bắt buộc: khi bỏ trống runtime mặc định sang `Resolved`, đúng như mô tả
        của operation. `required` không được chứa `status`, nếu không một trình
        kiểm tra OpenAPI sẽ từ chối chính request mặc định đó.
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
        note:
          type: string
          description: Ghi chú kèm theo lần đổi trạng thái; được lưu vào ticket, timeline và audit
          example: Đã liên hệ nhà cung cấp, chờ tái kiểm tra
      additionalProperties: true

    MiniERPIncidentInput:
      type: object
      description: Payload incident idempotent từ MiniERP
      required: [externalRef, title]
      properties:
        externalRef: { type: string, example: ERP-2026-0001 }
        source: { type: string, enum: [MINIERP], default: MINIERP }
        title: { type: string, example: ERP transaction failed }
        description: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        service: { type: string, example: MiniERP }
        referenceType: { type: string }
        referenceNo: { type: string }
        correlationId: { type: string }
      additionalProperties: true

    MonitoringCheck:
      type: object
      description: Một monitoring check kèm trạng thái probe gần nhất
      required: [id, name, type, target, status]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [HTTP, TCP, DNS] }
        target: { type: string }
        port: { type: integer, nullable: true }
        status: { type: string, enum: [UP, DOWN, DEGRADED, UNKNOWN] }
        consecutiveFailures: { type: integer }
        failureThreshold: { type: integer }
        businessService: { type: string }
        criticality: { type: string }
        enabled: { type: boolean }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        lastMessage: { type: string, nullable: true }
        activeIncidentId: { type: integer, nullable: true }

    MonitoringCheckList:
      type: array
      description: Danh sách monitoring check kèm trạng thái probe
      items:
        $ref: '#/components/schemas/MonitoringCheck'

    MonitoringHistoryEntry:
      type: object
      description: Một lần probe đã ghi vào lịch sử
      required: [id, checkId, at, status]
      properties:
        id: { type: integer }
        checkId: { type: integer }
        at: { type: string }
        status: { type: string, enum: [UP, DOWN, DEGRADED] }
        message: { type: string, nullable: true }
        consecutiveFailures: { type: integer }
        correlationId: { type: integer, nullable: true }

    MonitoringHistoryPage:
      type: object
      description: Trang lịch sử probe
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MonitoringHistoryEntry'
        count: { type: integer }

    MonitoringRunResult:
      type: object
      description: Kết quả một lần chạy probe
      required: [check, history]
      properties:
        check:
          $ref: '#/components/schemas/MonitoringCheck'
        history:
          $ref: '#/components/schemas/MonitoringHistoryEntry'

    MonitoringStatus:
      type: object
      description: Tổng hợp monitoring cho UI
      required: [checks, up, down, degraded]
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/MonitoringCheck'
        up: { type: integer }
        down: { type: integer }
        degraded: { type: integer }

    AuditEventList:
      type: object
      description: Trang audit event
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        count: { type: integer }

    License:
      type: object
      required: [id, software, total, assigned, available, utilizationPercent, renewalDate]
      properties:
        id:
          type: integer
          example: 1
        software:
          type: string
          example: Microsoft 365 Business Standard
        total:
          type: integer
          example: 100
        assigned:
          type: integer
          example: 84
        available:
          type: integer
          description: total - assigned
          example: 16
        utilizationPercent:
          type: integer
          description: round(assigned / total * 100)
          example: 84
        renewalDate:
          type: string
          example: '2027-01-15'

    Health:
      type: object
      description: Trạng thái dịch vụ (HEALTHCHECK của Docker)
      required: [status, uptime, timestamp]
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number
          description: Số giây server đã chạy
          example: 42.18
        timestamp:
          type: string
          example: '2026-09-23 14:10'
        storage:
          type: string
          example: json-file
        dataDir:
          type: string
          example: /app/data
        seeded:
          type: boolean
          example: false
        service:
          type: string
          example: enterprise-it-asset-portal
        version:
          type: string
          example: 2.0.0
        host:
          type: string
          example: it-portal
        authMode:
          type: string
          description: >-
            Chế độ xác thực đang chạy. `legacy` = mọi endpoint mở (demo nội bộ);
            `lab` = mọi endpoint ngoài /api/health và /api/auth/login yêu cầu
            `Authorization: Bearer <token>` lấy từ POST /api/auth/login.
          enum: [legacy, lab]
          example: legacy
        counts:
          type: object
          description: Số bản ghi hiện có trong db.json
          properties:
            assets:
              type: integer
              example: 6
            tickets:
              type: integer
              example: 6
            licenses:
              type: integer
              example: 4
        webhook:
          type: string
          example: mock

    DashboardStats:
      type: object
      description: KPI tổng hợp cho màn hình Dashboard
      required: [totalAssets, openTickets, slaPercent, generatedAt]
      properties:
        totalAssets:
          type: integer
          example: 6
        activeAssets:
          type: integer
          example: 5
        storageAssets:
          type: integer
          example: 1
        maintenanceAssets:
          type: integer
          example: 0
        retiredAssets:
          type: integer
          example: 0
        openTickets:
          type: integer
          example: 1
        resolvedTickets:
          type: integer
          example: 5
        closedTickets:
          type: integer
          example: 0
        criticalAlerts:
          type: integer
          example: 0
        slaPercent:
          type: number
          description: Tỷ lệ ticket đã Resolved/Closed trên tổng số
          example: 83.3
        assetsByType:
          type: object
          description: Thống kê tài sản theo loại
          additionalProperties:
            type: integer
          example:
            Laptop: 3
            Desktop PC: 1
            Printer: 1
            Network Switch: 1
        licenseTotal:
          type: integer
          example: 245
        licenseAssigned:
          type: integer
          example: 217
        licenseAlerts:
          type: integer
          description: Số bản quyền trên ngưỡng cảnh báo sử dụng
          example: 1
        generatedAt:
          type: string
          example: '2026-09-23 14:10'

    NotificationHistory:
      type: object
      description: Lịch sử cảnh báo tự động (webhook/mock)
      required: [delivery, channels, count, items]
      properties:
        delivery:
          type: string
          example: mock
        channels:
          type: array
          items:
            type: string
          example:
            - telegram-bot://it-helpdesk-alert
            - smtp://it-alerts@bmc.local
        lastDelivery:
          type: object
          description: Bản ghi gửi gần nhất
          properties:
            ticketId:
              type: integer
              example: 1006
            priority:
              $ref: '#/components/schemas/Priority'
            alerted:
              type: boolean
              example: false
            reason:
              type: string
              example: priority dưới ngưỡng cảnh báo (High/Critical)
            at:
              type: string
              example: '2026-09-23 14:10'
        count:
          type: integer
          example: 2
        items:
          type: array
          items:
            type: object
            properties:
              ticketId:
                type: integer
                example: 1005
              priority:
                $ref: '#/components/schemas/Priority'
              alerted:
                type: boolean
                example: true
              at:
                type: string
                example: '2026-09-23 13:45'

    Error:
      type: object
      description: Lỗi theo hợp đồng API (400/404/405/409/422)
      required: [error, status, path]
      properties:
        error:
          type: string
          example: 'Thiếu trường bắt buộc: title.'
        status:
          type: integer
          example: 400
        path:
          type: string
          example: /api/tickets
        allow:
          type: array
          description: Chỉ có ở lỗi 405 — danh sách method được phép
          items:
            type: string
          example: [GET, POST]
        errors:
          type: array
          description: Chi tiết từng trường sai (lỗi 400/422)
          items:
            type: object
            properties:
              field:
                type: string
                example: priority
              message:
                type: string
                example: priority phải là một trong Low, Medium, High, Critical.

    AiStatus:
      type: object
      description: Trạng thái trợ lý AI (OpenAI tuỳ chọn, Ollama local hoặc playbook offline)
      required: [engine, reachable, url, model, checkedAt]
      properties:
        engine:
          type: string
          description: '`openai` = cloud provider; `ollama` = LLM local; `rule-based` = playbook offline'
          enum: [openai, ollama, rule-based]
          example: rule-based
        reachable:
          type: boolean
          example: false
        url:
          type: string
          example: http://127.0.0.1:11434
        model:
          type: string
          example: qwen2.5:3b
        models:
          type: array
          description: Danh sách model Ollama đã tải (rỗng nếu không reachable)
          items:
            type: string
          example: ['qwen2.5:3b', 'llama3.2:3b']
        error:
          type: string
          nullable: true
          description: Lý do không reachable (null khi Ollama chạy)
          example: 'fetch failed'
        checkedAt:
          type: string
          example: '2026-09-23 14:10'

    AiAnalyzeInput:
      type: object
      description: 'Cần `ticketId` HOẶC `title` (thiếu cả hai → 400)'
      properties:
        ticketId:
          type: integer
          description: Phân tích ticket đã có trong DB (404 nếu không tồn tại)
          example: 1001
        title:
          type: string
          description: Mô tả/tiêu đề tự do khi chưa tạo ticket
          example: Máy in offline không in được
        requester:
          type: string
          example: Nguyen Thi Mai
        dept:
          type: string
          example: Accounting
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          type: string
          example: Network

    AiAnalysis:
      type: object
      description: Kết quả phân tích 4 phần ITIL (engine ollama hoặc rule-based)
      required: [ticketId, engine, summary, diagnosis, rca, prevention, generatedAt]
      properties:
        ticketId:
          type: integer
          nullable: true
          description: null khi phân tích từ `title` tự do
          example: 1001
        engine:
          type: string
          enum: [ollama, rule-based]
          example: ollama
        model:
          type: string
          nullable: true
          example: qwen2.5:3b
        playbook:
          type: string
          nullable: true
          description: Tên playbook khi engine = rule-based, null khi dùng LLM
          example: Network — APIPA / DHCP
        summary:
          type: string
          example: Máy không nhận được IP hợp lệ từ DHCP (APIPA) → mất kết nối mạng.
        diagnosis:
          type: array
          items:
            type: string
          example:
            - ipconfig /all — kiểm tra có dải 169.254.x.x (APIPA) không
            - ipconfig /release && ipconfig /renew — thử xin lại IP
        rca:
          type: string
          example: Dịch vụ DHCP Server dừng/scope hết lease khiến máy không xin được IP.
        prevention:
          type: array
          items:
            type: string
          example:
            - Theo dõi DHCP scope usage + đặt cảnh báo hết lease
            - Bật DHCP failover giữa 2 server
        fallbackReason:
          type: string
          description: Chỉ có khi fallback sang rule-based (Ollama lỗi/timeout)
          example: 'fetch failed'
        generatedAt:
          type: string
          example: '2026-09-23 14:10'

    AgentRun:
      type: object
      description: |
        Kết quả một lượt chạy của agent. `status` cho biết vòng lặp dừng ở
        đâu: `answered` (đã có câu trả lời), `needs_approval` (agent đề xuất
        hành động ghi, chờ người duyệt), `needs_clarification` (input không hợp
        lệ) hoặc `blocked` (guardrail chặn prompt-injection).
      required: [status, answer, grounded, trace, proposedAction, memory]
      properties:
        status:
          type: string
          enum: [answered, needs_approval, needs_clarification, blocked]
          example: needs_approval
        answer:
          type: string
          description: Câu trả lời tiếng Việt (đã lọc secret, cắt độ dài)
          example: 'Máy in phòng kế toán kẹt giấy. Bước 1: mở nắp sau...'
        grounded:
          type: boolean
          description: Câu trả lời có căn cứ từ tool/knowledge base hay không
          example: true
        evidenceCount:
          type: integer
          description: Số lần gọi tool thành công trong vòng lặp
          example: 2
        trace:
          type: array
          description: Nhật ký từng bước PLAN/ACT — dùng để audit vì sao agent trả lời vậy
          items:
            type: object
            properties:
              step: { type: integer, example: 0 }
              phase:
                type: string
                enum: [input_guard, plan, act]
                example: plan
              tool: { type: string, nullable: true, example: search_tickets }
              ok: { type: boolean, example: true }
              engine: { type: string, example: llm }
        proposedAction:
          type: object
          nullable: true
          description: |
            Chỉ có khi `status = needs_approval`. **Hành động này chưa được thực
            thi** — gửi `token` tới `POST /api/ai/agent/approve` để người dùng
            duyệt mới ghi dữ liệu thật.
          properties:
            token: { type: string, example: act_m1x2y3_ab12cd34 }
            tool: { type: string, example: create_ticket }
            args: { type: object }
            reason: { type: string, example: 'Người dùng yêu cầu tạo ticket.' }
            expiresAt: { type: string, example: '2026-09-23T14:25:00.000Z' }
        memory:
          type: object
          description: Báo cáo bộ nhớ sau lượt này
          properties:
            learned:
              type: array
              description: Ký ức dài hạn được học từ lời người dùng (chỉ tự khai rõ)
              items: { type: string }
              example: ['Tôi tên là Mai']
            recalled: { type: integer, example: 1 }

    AgentStatus:
      type: object
      description: Năng lực agent đang chạy (engine, tool registry, bộ nhớ)
      required: [engine, tiers, maxSteps, tools, sideEffectPolicy, memory, pendingApprovals]
      properties:
        engine:
          type: string
          description: '`rule-based` khi không có LLM nào trả lời được; còn lại là tên engine đang dùng'
          example: rule-based
        tiers:
          type: array
          description: Chuỗi LLM dự phòng theo thứ tự ưu tiên
          items: { type: string }
          example: ['ollama']
        maxSteps:
          type: integer
          description: Số bước tối đa mỗi lượt trong vòng lặp PLAN→ACT→OBSERVE
          example: 4
        tools:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: create_ticket }
              sideEffect:
                type: boolean
                description: Tool ghi dữ liệu thật → bắt buộc có người duyệt
                example: true
              autoAllowed:
                type: boolean
                description: Tool được phép tự chạy trong vòng lặp (luôn false cho tool ghi)
                example: false
        sideEffectPolicy:
          type: string
          example: 'side-effect tools require explicit human approval; agent can only propose'
        memory:
          type: object
          properties:
            sessions: { type: integer, example: 2 }
            longTerm: { type: integer, example: 3 }
            ltmEnabled: { type: boolean, example: true }
        pendingApprovals:
          type: integer
          description: Số hành động đang chờ người dùng duyệt
          example: 1


  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Đăng nhập và lấy token từ POST /api/auth/login, gửi kèm header
        Authorization: Bearer <token>. Token hết hạn sau 8 giờ.



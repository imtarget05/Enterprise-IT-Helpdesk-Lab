openapi: 3.1.0
info:
  title: IT Asset & Helpdesk Portal API
  summary: REST API quản lý tài sản CNTT, ticket ITIL và bản quyền phần mềm
  version: 2.0.0
  description: |
    API nội bộ của **IT Asset & Helpdesk Portal** (BMC Vietnam — Enterprise IT Lab).

    **Đặc điểm thiết kế:**
    - Không cần database ngoài: dữ liệu lưu trong `data/db.json` bằng cơ chế ghi
      **atomic (ghi file tạm rồi `rename`)** + tự phục hồi khi file JSON hỏng.
    - Mọi mutation `await store.commit()` **trước khi** trả 200/201 → restart
      container/server không mất dữ liệu.
    - Báo cáo CSV dùng chuẩn RFC-4180 + **UTF-8 BOM** để mở trực tiếp bằng Excel
      mà không lỗi font tiếng Việt.
    - Mã lỗi theo hợp đồng: `400` thiếu/sai dữ liệu, `404` không tồn tại,
      `405` sai method (kèm header `Allow`), `409` trùng Asset Tag/Serial,
      `422` giá trị enum không hợp lệ.

    File này được phục vụ tĩnh tại `/openapi.yaml`. Dán vào <https://editor.swagger.io>
    để xem dạng tài liệu tương tác.
  contact:
    name: Mai Nguyen Binh Tan
    url: https://github.com/imtarget05
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:3000
    description: Local — `npm start` hoặc `docker compose up -d --wait`
  - url: http://it-portal:3000
    description: Trong mạng Docker Compose (gọi giữa các container)

tags:
  - name: Health
    description: Kiểm tra tình trạng dịch vụ (dùng cho HEALTHCHECK của Docker)
  - name: Dashboard
    description: Số liệu tổng hợp cho màn hình Dashboard
  - name: Assets
    description: Vòng đời tài sản CNTT (đăng ký, cấp phát, thu hồi, thanh lý)
  - name: Tickets
    description: Ticket hỗ trợ theo vòng đời ITIL
  - name: Licenses
    description: Bản quyền phần mềm và mức sử dụng
  - name: Notifications
    description: Lịch sử cảnh báo tự động (webhook/mock)
  - name: AI
    description: Trợ lý AI phân tích ticket bằng LLM chạy LOCAL qua Ollama (không dùng OpenAI) — tự fallback playbook rule-based offline
  - name: Auth
    description: Đăng nhập lab, phiên Bearer và phân quyền RBAC
  - name: ITSM
    description: Problem, Change và Access lifecycle theo ITIL
  - name: Monitoring
    description: Health check, lịch sử probe và incident tự động
  - name: Integrations
    description: MiniERP incident receiver idempotent
  - name: Audit
    description: Audit trail bền vững cho mutation và truy cập nhạy cảm

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Tình trạng dịch vụ
      operationId: getHealth
      responses:
        '200':
          description: Dịch vụ đang chạy bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                uptime: 42.18
                timestamp: '2026-09-23 14:10'
                storage: json-file
                dataDir: /app/data
                seeded: false
                service: enterprise-it-asset-portal
                version: 2.0.0
                host: it-portal
                counts:
                  assets: 6
                  tickets: 6
                  licenses: 4
                webhook: mock

  /api/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: KPI tổng hợp cho Dashboard
      operationId: getDashboardStats
      responses:
        '200':
          description: Số liệu KPI, bao gồm tỷ lệ SLA và cảnh báo bản quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
              example:
                totalAssets: 6
                activeAssets: 5
                storageAssets: 1
                maintenanceAssets: 0
                retiredAssets: 0
                openTickets: 1
                resolvedTickets: 5
                closedTickets: 0
                criticalAlerts: 0
                slaPercent: 83.3
                assetsByType:
                  Laptop: 3
                  Desktop PC: 1
                  Printer: 1
                  Network Switch: 1
                licenseTotal: 245
                licenseAssigned: 217
                licenseAlerts: 1
                generatedAt: '2026-09-23 14:10'


  /api/assets:
    get:
      tags: [Assets]
      summary: Danh sách tài sản (kèm bộ lọc)
      operationId: listAssets
      parameters:
        - $ref: '#/components/parameters/QuerySearch'
        - $ref: '#/components/parameters/FilterStatusAsset'
        - $ref: '#/components/parameters/FilterType'
      responses:
        '200':
          description: Mảng tài sản khớp bộ lọc (mảng rỗng nếu không có kết quả)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
    post:
      tags: [Assets]
      summary: Đăng ký tài sản mới
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
            example:
              tag: LP-SALES-021
              type: Laptop
              brand: Dell
              model: Latitude 5450
              serial: 9PLK21X
              assignedTo: Le Hoang Nam
              dept: Sales
              status: Active
              ip: 192.168.10.131
      responses:
        '201':
          description: Đã tạo tài sản (id do server sinh)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/assets/export.csv:
    get:
      tags: [Assets]
      summary: Xuất báo cáo kiểm kê tài sản ra CSV (tôn trọng bộ lọc)
      operationId: exportAssetsCsv
      parameters:
        - $ref: '#/components/parameters/QuerySearch'
        - $ref: '#/components/parameters/FilterStatusAsset'
        - $ref: '#/components/parameters/FilterType'
      responses:
        '200':
          description: |
            File CSV RFC-4180 + UTF-8 BOM. Tên file dạng
            `IT-Asset-Audit_YYYYMMDD_HHmm.csv`; số bản ghi nằm ở header `X-Total-Records`.
          headers:
            Content-Disposition:
              description: Tên file tải về
              schema:
                type: string
                example: attachment; filename="IT-Asset-Audit_20260923_1410.csv"
            X-Total-Records:
              description: Số bản ghi trong file
              schema:
                type: integer
                example: 6
          content:
            text/csv:
              schema:
                type: string
              example: |
                "Asset Tag (Mã tài sản)","Type (Loại)","Brand (Hãng)","Model","Serial","Assigned To","Department","Status","IP Address"
                "LP-IT-001","Laptop","Lenovo","ThinkPad T14 Gen 4","PF-39X8K2","Mai Nguyen Binh Tan","IT Support","Active","192.168.10.101"

  /api/assets/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Assets]
      summary: Chi tiết một tài sản
      operationId: getAsset
      responses:
        '200':
          description: Tài sản tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Assets]
      summary: Cập nhật một phần thông tin tài sản (cấp phát / thu hồi / đổi trạng thái)
      operationId: updateAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPatchInput'
            examples:
              capPhat:
                summary: Cấp phát thiết bị cho nhân viên
                value:
                  assignedTo: Le Hoang Nam
                  dept: Sales
                  status: Active
                  ip: 192.168.10.131
              thuHoi:
                summary: Thu hồi về kho IT
                value:
                  assignedTo: Unassigned
                  dept: IT Storage
                  status: In Storage
                  ip: '-'
      responses:
        '200':
          description: Tài sản sau khi cập nhật (có thêm `updatedAt`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Assets]
      summary: Xoá tài sản khỏi hệ thống
      operationId: deleteAsset
      responses:
        '200':
          description: Đã xoá
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  deletedId:
                    type: integer
              example:
                success: true
                message: Đã xoá tài sản LP-SALES-021 (id 7).
                deletedId: 7
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tickets:
    get:
      tags: [Tickets]
      summary: Danh sách ticket (kèm bộ lọc)
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/QuerySearch'
        - $ref: '#/components/parameters/FilterStatusTicket'
        - $ref: '#/components/parameters/FilterPriority'
      responses:
        '200':
          description: Mảng ticket khớp bộ lọc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
    post:
      tags: [Tickets]
      summary: Tạo ticket mới (tự gửi cảnh báo nếu High/Critical)
      description: |
        Ticket mới luôn ở trạng thái `Open`. Nếu `priority` là `High` hoặc `Critical`,
        hệ thống gọi notifier (webhook thật nếu cấu hình `IT_WEBHOOK_URL`, ngược lại ghi
        `data/notifications.log` + console) và trả thêm cờ `alerted: true`.
        Lỗi webhook **không** làm hỏng request tạo ticket.
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
            example:
              title: Cannot resolve DNS after changing Wi-Fi
              requester: Le Hoang Nam
              dept: Sales
              priority: High
              category: DNS
      responses:
        '201':
          description: Ticket created successfully (may include alerted flag for High/Critical)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
              example:
                id: 1007
                title: Cannot resolve DNS after changing Wi-Fi
                requester: Le Hoang Nam
                dept: Sales
                priority: High
                status: Open
                category: DNS
                createdAt: '2026-09-23 14:10'
                alerted: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/tickets/export.csv:
    get:
      tags: [Tickets]
      summary: Xuất báo cáo ticket ra CSV (tôn trọng bộ lọc)
      operationId: exportTicketsCsv
      parameters:
        - $ref: '#/components/parameters/QuerySearch'
        - $ref: '#/components/parameters/FilterStatusTicket'
        - $ref: '#/components/parameters/FilterPriority'
      responses:
        '200':
          description: File CSV RFC-4180 + UTF-8 BOM, tên dạng `IT-Ticket-Report_YYYYMMDD_HHmm.csv`
          headers:
            X-Total-Records:
              description: Số bản ghi trong file
              schema:
                type: integer
                example: 6
          content:
            text/csv:
              schema:
                type: string

  /api/tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Tickets]
      summary: Chi tiết một ticket
      operationId: getTicket
      responses:
        '200':
          description: Ticket tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tickets/{id}/status:
    parameters:
      - $ref: '#/components/parameters/PathId'
    patch:
      tags: [Tickets]
      summary: Chuyển trạng thái ticket (Open → In Progress → Resolved → Closed)
      description: |
        Khi chuyển sang `Resolved`/`Closed`, server tự ghi `resolvedAt` (chỉ lần đầu).
        Khi mở lại về `Open`/`In Progress`, `resolvedAt` bị xoá. Luôn ghi `updatedAt`.
        Không truyền `status` thì mặc định là `Resolved`.
      operationId: updateTicketStatus
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/TicketStatus'
              required: [status]
            example:
              status: In Progress
      responses:
        '200':
          description: Ticket sau khi đổi trạng thái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'


  /api/licenses:
    get:
      tags: [Licenses]
      summary: Danh sách bản quyền phần mềm kèm mức sử dụng
      operationId: listLicenses
      responses:
        '200':
          description: Mảng bản quyền (đã thêm `available` và `utilizationPercent` do server tính)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/License'
              example:
                - id: 1
                  software: Microsoft 365 Business Standard
                  total: 100
                  assigned: 84
                  available: 16
                  utilizationPercent: 84
                  renewalDate: '2027-01-15'
                - id: 4
                  software: AutoCAD 2026 Commercial
                  total: 15
                  assigned: 15
                  available: 0
                  utilizationPercent: 100
                  renewalDate: '2026-10-30'

  /api/licenses/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Licenses]
      summary: Chi tiết một bản quyền phần mềm
      operationId: getLicense
      responses:
        '200':
          description: Bản quyền tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/notifications:
    get:
      tags: [Notifications]
      summary: Lịch sử cảnh báo đã gửi
      operationId: listNotifications
      parameters:
        - name: limit
          in: query
          description: Số bản ghi gần nhất cần lấy (1–50, mặc định 20)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Kênh cảnh báo, lần gửi gần nhất và danh sách sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationHistory'
              example:
                delivery: mock
                channels:
                  - telegram-bot://it-helpdesk-alert
                  - smtp://it-alerts@bmc.local
                lastDelivery:
                  ticketId: 1006
                  priority: Low
                  alerted: false
                  reason: 'priority dưới ngưỡng cảnh báo (High/Critical)'
                  at: '2026-09-23 14:10'
                count: 2
                items:
                  - ticketId: 1005
                    priority: High
                    alerted: true
                    at: '2026-09-23 13:45'
  /api/ai/status:
    get:
      tags: [AI]
      summary: Trạng thái trợ lý AI (LLM local qua Ollama)
      description: |
        Probe nhanh Ollama server (timeout 1.5s) để UI biết đang dùng **LLM local**
        hay **playbook rule-based offline**. Endpoint luôn trả 200 — không có
        Ollama cũng không phải lỗi (fail-soft, giống webhook alert).
      operationId: getAiStatus
      responses:
        '200':
          description: Engine đang dùng, model cấu hình và danh sách model đã tải (nếu reachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatus'
              example:
                engine: rule-based
                reachable: false
                url: http://127.0.0.1:11434
                model: qwen2.5:3b
                models: []
                error: 'fetch failed'
                checkedAt: '2026-09-23 14:10'

  /api/ai/analyze:
    post:
      tags: [AI]
      summary: Phân tích ticket — tóm tắt, chẩn đoán, RCA, phòng ngừa
      description: |
        Nhận `ticketId` (ticket có sẵn trong DB) **hoặc** `title` (input tự do,
        kèm `requester`/`dept`/`priority`/`category` tuỳ chọn).

        - Ollama chạy → gọi **LLM local** (`POST /api/chat`, `format: json`) và
          parse kết quả thành 4 phần ITIL.
        - Ollama không chạy / timeout / JSON hỏng → **fallback playbook
          rule-based offline** (keyword → runbook) và ghi lý do vào
          `fallbackReason`. Vẫn trả 200.

        Không dùng OpenAI hay bất kỳ cloud API nào — toàn bộ inference chạy local.
      operationId: analyzeTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalyzeInput'
            examples:
              byTicketId:
                summary: Phân tích ticket có sẵn
                value:
                  ticketId: 1001
              byTitle:
                summary: Phân tích mô tả tự do (chưa tạo ticket)
                value:
                  title: 'Máy in offline không in được'
                  category: Hardware
                  priority: Medium
      responses:
        '200':
          description: Kết quả phân tích (engine ollama hoặc rule-based)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnalysis'
              example:
                ticketId: 1001
                engine: rule-based
                model: null
                playbook: Network — APIPA / DHCP
                summary: Máy không nhận được IP hợp lệ từ DHCP (dấu hiệu APIPA 169.254.x.x) → mất kết nối mạng.
                diagnosis:
                  - ipconfig /all — kiểm tra có dải 169.254.x.x (APIPA) không
                  - ipconfig /release && ipconfig /renew — thử xin lại IP
                  - Ping gateway mặc định — nếu timeout, kiểm tra switch/port và cáp LAN
                rca: Dịch vụ DHCP Server dừng/scope hết lease khiến máy không xin được IP.
                prevention:
                  - Theo dõi DHCP scope usage + đặt cảnh báo hết lease
                  - Ghi lại MAC đã cấp phát, bật DHCP failover giữa 2 server
                fallbackReason: 'fetch failed'
                generatedAt: '2026-09-23 14:10'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'



  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập lab và nhận Bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, format: password, example: admin-pass }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                required: [token, username, role, expiresInSeconds]
                properties:
                  token: { type: string }
                  username: { type: string }
                  role: { type: string, example: IT_ADMIN }
                  expiresInSeconds: { type: integer, example: 28800 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Thu hồi Bearer session hiện tại
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Session đã thu hồi
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Đọc user và quyền hiện tại
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: User và permission list
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: object }
                  permissions: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/tickets/{id}/timeline:
    get:
      tags: [Tickets]
      summary: Timeline sự kiện của ticket
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses:
        '200':
          description: Danh sách event theo thứ tự thời gian
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tickets/{id}/assign:
    post:
      tags: [Tickets]
      summary: Gán ticket cho L1/L2 hoặc nhóm
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignee: { type: string, example: l2 }
                assignedGroup: { type: string, example: Network Operations }
      responses:
        '200': { description: Ticket sau khi gán }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tickets/{id}/work-notes:
    post:
      tags: [Tickets]
      summary: Thêm work note đã sanitize vào timeline
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000, example: Đã kiểm tra DHCP scope. }
      responses:
        '201': { description: Work note đã tạo }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tickets/{id}/transition:
    post:
      tags: [Tickets]
      summary: Chuyển state chuẩn NEW/ASSIGNED/IN_PROGRESS/PENDING/RESOLVED/CLOSED
      security: [{ BearerAuth: [] }]

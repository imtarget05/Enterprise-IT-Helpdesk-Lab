        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: Khoá chính (integer id trong `data/db.json`)
      schema:
        type: integer
        example: 1
    QuerySearch:
      name: q
      in: query
      description: Tìm chuỗi con (không phân biệt hoa/thường) trên các trường văn bản của resource
      schema:
        type: string
        example: thinkpad
    FilterStatusAsset:
      name: status
      in: query
      description: Lọc theo trạng thái tài sản
      schema:
        $ref: '#/components/schemas/AssetStatus'
    FilterType:
      name: type
      in: query
      description: Lọc theo loại thiết bị
      schema:
        type: string
        example: Laptop
    FilterStatusTicket:
      name: status
      in: query
      description: Lọc theo trạng thái ticket
      schema:
        $ref: '#/components/schemas/TicketStatus'
    FilterPriority:
      name: priority
      in: query
      description: Lọc theo mức độ ưu tiên
      schema:
        $ref: '#/components/schemas/Priority'

  responses:
    Unauthorized:
      description: Thiếu hoặc không hợp lệ Bearer session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication required.
            status: 401
            path: /api/tickets
    Forbidden:
      description: Người dùng đã đăng nhập nhưng không có permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Insufficient portal role.
            status: 403
            path: /api/changes
    BadRequest:
      description: Thiếu trường bắt buộc hoặc payload không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Dữ liệu đăng ký tài sản không hợp lệ.
            status: 400
            path: /api/assets
            details:
              - 'Thiếu trường bắt buộc: brand'
    NotFound:
      description: Không tìm thấy bản ghi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Tài sản với id "999" không tồn tại.'
            status: 404
            path: /api/assets/999
    Conflict:
      description: Trùng Asset Tag hoặc Serial (ràng buộc duy nhất của kiểm kê)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Mã tài sản (Asset Tag) "LP-IT-001" đã tồn tại — trùng với LP-IT-001 (id 1).'
            status: 409
            path: /api/assets
    Unprocessable:
      description: Giá trị enum không hợp lệ (status/priority)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Trạng thái không hợp lệ: "Broken". Giá trị cho phép: Active, In Storage, Maintenance, Retired.'
            status: 422
            path: /api/assets
    MethodNotAllowed:
      description: Sai HTTP method cho endpoint đã tồn tại (kèm header `Allow`)
      headers:
        Allow:
          description: Danh sách method được phép
          schema:
            type: string
            example: GET, POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Phương thức PUT không được hỗ trợ cho /api/assets.
            allow: [GET, POST]
            status: 405
            path: /api/assets


  schemas:
    Problem:
      type: object
      description: Problem record theo ITIL
      required: [id, title, status, linkedTicketIds, createdAt]
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: ERP intermittent }
        service: { type: string, example: MiniERP }
        status: { type: string, example: OPEN }
        rootCause: { type: string }
        workaround: { type: string }
        knownError: { type: boolean }
        linkedTicketIds: { type: array, items: { type: integer } }
        owner: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Change:
      type: object
      description: Change record có kiểm soát và rollback
      required: [id, title, reason, risk, implementationState]
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: Firewall rule update }
        reason: { type: string }
        risk: { type: string, enum: [LOW, MEDIUM, HIGH] }
        rollbackPlan: { type: string }
        implementationState: { type: string, example: DRAFT }
        approval: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AccessRequest:
      type: object
      description: Onboarding/offboarding access request
      required: [id, requestType, employeeId, name, executionState, evidence]
      properties:
        id: { type: integer, example: 1 }
        requestType: { type: string, enum: [ONBOARDING, OFFBOARDING] }
        employeeId: { type: string, example: EMP-0101 }
        name: { type: string, example: Nguyen Thi Mai }
        upn: { type: string }
        department: { type: string }
        requestedGroups: { type: array, items: { type: string } }
        requestedErpRole: { type: string }
        executionState: { type: string, example: READY }
        evidence: { type: array, items: { type: object } }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [id, at, actor, action, entityType]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string }
        role: { type: string }
        action: { type: string, example: TICKET_TRANSITION }
        entityType: { type: string }
        entityId: { type: integer, nullable: true }
        details: { type: object, additionalProperties: true }

    AssetStatus:
      type: string
      description: Trạng thái vòng đời của tài sản
      enum: [Active, In Storage, Maintenance, Retired]

    TicketStatus:
      type: string
      description: Trạng thái ticket theo vòng đời ITIL
      enum: [Open, In Progress, Resolved, Closed]

    Priority:
      type: string
      description: Mức độ ưu tiên (`High`/`Critical` sẽ kích hoạt cảnh báo tự động)
      enum: [Low, Medium, High, Critical]

    Asset:
      type: object
      description: Tài sản CNTT đã đăng ký trong hệ thống
      required: [id, tag, type, brand, model, serial, assignedTo, dept, status, ip, createdAt]
      properties:
        id:
          type: integer
          example: 1
        tag:
          type: string
          description: Mã tài sản — duy nhất trong toàn hệ thống
          example: LP-IT-001
        type:
          type: string
          description: Loại thiết bị (Laptop, Desktop PC, Printer, Network Switch, …)
          example: Laptop
        brand:
          type: string
          example: Lenovo
        model:
          type: string
          example: ThinkPad T14 Gen 4
        serial:
          type: string
          description: Serial — duy nhất nếu được cung cấp
          example: PF-39X8K2
        assignedTo:
          type: string
          description: Người đang sử dụng, hoặc `Unassigned` khi nằm trong kho
          example: Mai Nguyen Binh Tan
        dept:
          type: string
          example: IT Support
        status:
          $ref: '#/components/schemas/AssetStatus'
        ip:
          type: string
          description: Địa chỉ IP đang cấp, `-` nếu chưa gán
          example: 192.168.10.101
        createdAt:
          type: string
          description: Định dạng `yyyy-mm-dd hh:mm`
          example: '2026-09-23 08:00'
        updatedAt:
          type: string
          description: Chỉ xuất hiện sau khi tài sản được PATCH ít nhất một lần
          example: '2026-09-23 14:10'

    AssetInput:
      type: object
      description: Payload đăng ký tài sản mới
      required: [tag, brand, model, serial]
      properties:
        tag:
          type: string
          example: LP-SALES-021
        type:
          type: string
          default: Laptop
        brand:
          type: string
          example: Dell
        model:
          type: string
          example: Latitude 5450
        serial:
          type: string
          example: 9PLK21X
        assignedTo:
          type: string
          default: Unassigned
        dept:
          type: string
          default: General
        status:
          allOf:
            - $ref: '#/components/schemas/AssetStatus'
          default: Active
        ip:
          type: string
          default: '-'

    AssetPatchInput:
      type: object
      description: Payload cập nhật một phần — chỉ gửi các trường cần thay đổi
      properties:
        tag:
          type: string
        type:
          type: string
        brand:
          type: string
        model:
          type: string
        serial:
          type: string
        assignedTo:
          type: string
        dept:
          type: string
        status:
          $ref: '#/components/schemas/AssetStatus'
        ip:
          type: string

    Ticket:
      type: object
      description: Ticket hỗ trợ theo vòng đời ITIL
      required: [id, title, requester, dept, priority, status, category, createdAt]
      properties:
        id:
          type: integer
          example: 1001
        title:
          type: string
          example: Cannot access Internet due to APIPA IP
        requester:
          type: string
          example: Nguyen Thi Mai
        dept:
          type: string
          example: Accounting
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/TicketStatus'
        category:
          type: string
          description: Phân loại sự cố (Network, DNS, Active Directory, File Server, …)
          example: Network
        createdAt:
          type: string
          example: '2026-09-23 08:30'
        updatedAt:
          type: string
          example: '2026-09-23 14:10'
        resolvedAt:
          type: string
          description: Chỉ có khi ticket Resolved/Closed
          example: '2026-09-23 11:05'

    TicketInput:
      type: object
      description: Payload tạo ticket mới
      required: [title, requester]
      properties:
        title:
          type: string
          example: Cannot resolve DNS after changing Wi-Fi
        requester:
          type: string
          example: Le Hoang Nam
        dept:
          type: string
          default: General
        priority:
          $ref: '#/components/schemas/Priority'
          default: Medium
        category:
          type: string
          default: General

    License:
      type: object
      required: [id, software, total, assigned, available, utilizationPercent, renewalDate]
      properties:
        id:
          type: integer
          example: 1
        software:
          type: string
          example: Microsoft 365 Business Standard
        total:
          type: integer
          example: 100
        assigned:
          type: integer
          example: 84
        available:
          type: integer
          description: total - assigned
          example: 16
        utilizationPercent:
          type: integer
          description: round(assigned / total * 100)
          example: 84
        renewalDate:
          type: string
          example: '2027-01-15'

    Health:
      type: object
      description: Trạng thái dịch vụ (HEALTHCHECK của Docker)
      required: [status, uptime, timestamp]
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: number
          description: Số giây server đã chạy
          example: 42.18
        timestamp:
          type: string
          example: '2026-09-23 14:10'
        storage:
          type: string
          example: json-file
        dataDir:
          type: string
          example: /app/data
        seeded:
          type: boolean
          example: false
        service:
          type: string
          example: enterprise-it-asset-portal
        version:
          type: string
          example: 2.0.0
        host:
          type: string
          example: it-portal
        counts:
          type: object
          description: Số bản ghi hiện có trong db.json
          properties:
            assets:
              type: integer
              example: 6
            tickets:
              type: integer
              example: 6
            licenses:
              type: integer
              example: 4
        webhook:
          type: string
          example: mock

    DashboardStats:
      type: object
      description: KPI tổng hợp cho màn hình Dashboard
      required: [totalAssets, openTickets, slaPercent, generatedAt]
      properties:
        totalAssets:
          type: integer
          example: 6
        activeAssets:
          type: integer
          example: 5
        storageAssets:
          type: integer
          example: 1
        maintenanceAssets:
          type: integer
          example: 0
        retiredAssets:
          type: integer
          example: 0
        openTickets:
          type: integer
          example: 1
        resolvedTickets:
          type: integer
          example: 5
        closedTickets:
          type: integer
          example: 0
        criticalAlerts:
          type: integer
          example: 0
        slaPercent:
          type: number
          description: Tỷ lệ ticket đã Resolved/Closed trên tổng số
          example: 83.3
        assetsByType:
          type: object
          description: Thống kê tài sản theo loại
          additionalProperties:
            type: integer
          example:
            Laptop: 3
            Desktop PC: 1
            Printer: 1
            Network Switch: 1
        licenseTotal:
          type: integer
          example: 245
        licenseAssigned:
          type: integer
          example: 217
        licenseAlerts:
          type: integer
          description: Số bản quyền trên ngưỡng cảnh báo sử dụng
          example: 1
        generatedAt:
          type: string
          example: '2026-09-23 14:10'

    NotificationHistory:
      type: object
      description: Lịch sử cảnh báo tự động (webhook/mock)
      required: [delivery, channels, count, items]
      properties:
        delivery:
          type: string
          example: mock
        channels:
          type: array
          items:
            type: string
          example:
            - telegram-bot://it-helpdesk-alert
            - smtp://it-alerts@bmc.local
        lastDelivery:
          type: object
          description: Bản ghi gửi gần nhất
          properties:
            ticketId:
              type: integer
              example: 1006
            priority:
              $ref: '#/components/schemas/Priority'
            alerted:
              type: boolean
              example: false
            reason:
              type: string
              example: priority dưới ngưỡng cảnh báo (High/Critical)
            at:
              type: string
              example: '2026-09-23 14:10'
        count:
          type: integer
          example: 2
        items:
          type: array
          items:
            type: object
            properties:
              ticketId:
                type: integer
                example: 1005
              priority:
                $ref: '#/components/schemas/Priority'
              alerted:
                type: boolean
                example: true
              at:
                type: string
                example: '2026-09-23 13:45'

    Error:
      type: object
      description: Lỗi theo hợp đồng API (400/404/405/409/422)
      required: [error, status, path]
      properties:
        error:
          type: string
          example: 'Thiếu trường bắt buộc: title.'
        status:
          type: integer
          example: 400
        path:
          type: string
          example: /api/tickets
        allow:
          type: array
          description: Chỉ có ở lỗi 405 — danh sách method được phép
          items:
            type: string
          example: [GET, POST]
        errors:
          type: array
          description: Chi tiết từng trường sai (lỗi 400/422)
          items:
            type: object
            properties:
              field:
                type: string
                example: priority
              message:
                type: string
                example: priority phải là một trong Low, Medium, High, Critical.

    AiStatus:
      type: object
      description: Trạng thái trợ lý AI (LLM local qua Ollama)
      required: [engine, reachable, url, model, checkedAt]
      properties:
        engine:
          type: string
          description: '`ollama` = đang dùng LLM local; `rule-based` = playbook offline'
          enum: [ollama, rule-based]
          example: rule-based
        reachable:
          type: boolean
          example: false
        url:
          type: string
          example: http://127.0.0.1:11434
        model:
          type: string
          example: qwen2.5:3b
        models:
          type: array
          description: Danh sách model Ollama đã tải (rỗng nếu không reachable)
          items:
            type: string
          example: ['qwen2.5:3b', 'llama3.2:3b']
        error:
          type: string
          nullable: true
          description: Lý do không reachable (null khi Ollama chạy)
          example: 'fetch failed'
        checkedAt:
          type: string
          example: '2026-09-23 14:10'

    AiAnalyzeInput:
      type: object
      description: 'Cần `ticketId` HOẶC `title` (thiếu cả hai → 400)'
      properties:
        ticketId:
          type: integer
          description: Phân tích ticket đã có trong DB (404 nếu không tồn tại)
          example: 1001
        title:
          type: string
          description: Mô tả/tiêu đề tự do khi chưa tạo ticket
          example: Máy in offline không in được
        requester:
          type: string
          example: Nguyen Thi Mai
        dept:
          type: string
          example: Accounting
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          type: string
          example: Network

    AiAnalysis:
      type: object
      description: Kết quả phân tích 4 phần ITIL (engine ollama hoặc rule-based)
      required: [ticketId, engine, summary, diagnosis, rca, prevention, generatedAt]
      properties:
        ticketId:
          type: integer
          nullable: true
          description: null khi phân tích từ `title` tự do
          example: 1001
        engine:
          type: string
          enum: [ollama, rule-based]
          example: ollama
        model:
          type: string
          nullable: true
          example: qwen2.5:3b
        playbook:
          type: string
          nullable: true
          description: Tên playbook khi engine = rule-based, null khi dùng LLM
          example: Network — APIPA / DHCP
        summary:
          type: string
          example: Máy không nhận được IP hợp lệ từ DHCP (APIPA) → mất kết nối mạng.
        diagnosis:
          type: array
          items:
            type: string
          example:
            - ipconfig /all — kiểm tra có dải 169.254.x.x (APIPA) không
            - ipconfig /release && ipconfig /renew — thử xin lại IP
        rca:
          type: string
          example: Dịch vụ DHCP Server dừng/scope hết lease khiến máy không xin được IP.
        prevention:
          type: array
          items:
            type: string
          example:
            - Theo dõi DHCP scope usage + đặt cảnh báo hết lease
            - Bật DHCP failover giữa 2 server
        fallbackReason:
          type: string
          description: Chỉ có khi fallback sang rule-based (Ollama lỗi/timeout)
          example: 'fetch failed'
        generatedAt:
          type: string
          example: '2026-09-23 14:10'


  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Đăng nhập và lấy token từ POST /api/auth/login, gửi kèm header
        Authorization: Bearer <token>. Token hết hạn sau 8 giờ.


